<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Pro Settings Agent</title>
<style>
  :root {
    --bg: #0f1117;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #4c9aff;
    --accent-2: #38d39f;
    --user: #2b4b7a;
    --ai: #1c2434;
    --danger: #ff6b6b;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2a45 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }

  .container { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-weight: 600;
  }
  .card h2::before {
    content: "";
    width: 4px; height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ---------- 聊天区 ---------- */
  #messages {
    min-height: 280px;
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 2px;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fadeUp 0.25s ease;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: #d7e0f0;
  }

  .msg.error { align-self: flex-start; background: rgba(255, 107, 107, 0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.25); }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-row { display: flex; gap: 10px; margin-top: 14px; }

  input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  button {
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ---------- 选手查询 ---------- */
  #player-result { margin-top: 14px; }
  .empty-hint { color: var(--muted); text-align: center; padding: 24px 0; font-size: 14px; }

  .player-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }

  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  .player-name { font-size: 18px; font-weight: 700; }
  .player-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }

  .badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(76, 154, 255, 0.15);
    border: 1px solid rgba(76, 154, 255, 0.35);
    color: #9cc4ff;
  }
  .badge.green { background: rgba(56, 211, 159, 0.12); border-color: rgba(56, 211, 159, 0.35); color: #7fe3c0; }

  .code-box {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px dashed rgba(76, 154, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: Consolas, monospace;
    font-size: 13px;
    color: #9cc4ff;
  }
  .code-box button { padding: 6px 12px; font-size: 12px; background: rgba(76,154,255,0.2); color: #9cc4ff; border: 1px solid rgba(76,154,255,0.4); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .section { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .section h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; }
  td:first-child { color: var(--muted); width: 45%; }
  td:last-child { text-align: right; color: #e6e9f2; }

  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CS 职业选手设置助手</h1>
    <p>查询职业选手的灵敏度 · 准星 · 设置 · 荣誉</p>
  </header>

  <!-- 聊天 -->
  <div class="card">
    <h2>聊天查询</h2>
    <div id="messages">
      <div class="msg ai">你好！可以问我，比如：<br>"zywoo 的灵敏度是多少"<br>"s1mple 用什么鼠标"<br>"Vitality 战队有哪些选手"</div>
    </div>
    <div class="input-row">
      <input type="text" id="chat-input" placeholder="输入你的问题..." autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>

  <!-- 选手查询 -->
  <div class="card">
    <h2>选手设置速查</h2>
    <div class="input-row">
      <input type="text" id="player-input" placeholder="输入选手昵称 / 真名 / 战队..." autocomplete="off">
      <button id="search">查询</button>
    </div>
    <div id="player-result">
      <div class="empty-hint">输入选手名字，查看完整设置信息</div>
    </div>
  </div>

  <div class="footer-note">数据来源：ProSettings · Liquipedia</div>
</div>

<script>
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function display(value) {
  if (value === null || value === undefined || value === "") return "—";
  return String(value);
}

// ==================== 聊天 ====================
const messagesBox = document.getElementById("messages");
document.getElementById("send").addEventListener("click", sendChat);
document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendChat();
});

function appendMessage(cls, html) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  messagesBox.appendChild(div);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;

  appendMessage("user", escapeHtml(text));
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "msg ai";
  typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  messagesBox.appendChild(typing);

  const sendBtn = document.getElementById("send");
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) throw new Error(data.detail || "出错了");
    appendMessage("ai", escapeHtml(data.answer));
  } catch (e) {
    typing.remove();
    appendMessage("error", escapeHtml(e.message));
  } finally {
    sendBtn.disabled = false;
    document.getElementById("chat-input").focus();
  }
}

// ==================== 选手查询 ====================
const playerResult = document.getElementById("player-result");
document.getElementById("search").addEventListener("click", searchPlayer);
document.getElementById("player-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchPlayer();
});

function kv(label, value) {
  return `<tr><td>${label}</td><td>${escapeHtml(display(value))}</td></tr>`;
}

function settingsTable(obj) {
  if (!obj || typeof obj !== "object") return "<p>—</p>";
  const rows = Object.entries(obj).map(([k, v]) => kv(k, v)).join("");
  return `<table>${rows}</table>`;
}

async function searchPlayer() {
  const name = document.getElementById("player-input").value.trim();
  if (!name) return;
  playerResult.innerHTML = '<div class="empty-hint">加载中...</div>';

  const btn = document.getElementById("search");
  btn.disabled = true;
  try {
    const res = await fetch(`/api/player/${encodeURIComponent(name)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "出错了");

    // 有些字段是 JSON 字符串，先解析
    let crosshair = null, viewmodel = null, video = null;
    try { crosshair = JSON.parse(data.crosshair); } catch (e) {}
    try { viewmodel = JSON.parse(data.viewmodel); } catch (e) {}
    try { video = JSON.parse(data.video); } catch (e) {}

    const initial = (data.nickname || "?").charAt(0).toUpperCase();
    const badges = [];
    if (data.major_wins && data.major_wins !== "未公开") badges.push(`<span class="badge green">Major × ${data.major_wins}</span>`);
    if (data.hltv_rating && data.hltv_rating !== "未公开") badges.push(`<span class="badge">Rating ${data.hltv_rating}</span>`);
    if (data.hltv_mvp && data.hltv_mvp !== "未公开") badges.push(`<span class="badge">HLTV MVP × ${data.hltv_mvp}</span>`);

    const code = data.crosshair_code && data.crosshair_code !== "未公开"
      ? `<div class="code-box"><span>${escapeHtml(data.crosshair_code)}</span><button onclick="copyCode(this)">复制</button></div>`
      : "";

    playerResult.innerHTML = `
      <div class="player-head">
        <div class="avatar">${escapeHtml(initial)}</div>
        <div>
          <div class="player-name">${escapeHtml(display(data.nickname))}</div>
          <div class="player-meta">${escapeHtml(display(data.name))} · ${escapeHtml(display(data.country))} · ${escapeHtml(display(data.team))} · ${escapeHtml(display(data.role))}</div>
          <div class="badges">${badges.join("")}</div>
        </div>
      </div>
      ${code}
      <div class="grid">
        <div class="section"><h3>鼠标</h3>${settingsTable({ DPI: data.dpi, 灵敏度: data.sensitivity, eDPI: data.edpi, 鼠标: data.mouse, 回报率: data.hz, 开镜灵敏度: data.zoom_sensitivity })}</div>
        <div class="section"><h3>视频</h3>${settingsTable({ 分辨率: data.resolution, 宽高比: data.aspect_ratio, 缩放模式: data.scaling_mode, 显示模式: data.display_mode })}</div>
        <div class="section"><h3>准星参数</h3>${settingsTable(crosshair)}</div>
        <div class="section"><h3>视图模型</h3>${settingsTable(viewmodel)}</div>
        <div class="section"><h3>画面设置</h3>${settingsTable(video)}</div>
        <div class="section"><h3>数据信息</h3>${settingsTable({ 抓取时间: data.updated_at, 数据年龄: data.data_age_days ? `${data.data_age_days} 天` : "—" })}</div>
      </div>`;
  } catch (e) {
    playerResult.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function copyCode(btn) {
  const code = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = "复制"; }, 1500);
  });
}
</script>
</body>
</html>
